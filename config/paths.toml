# 因子测试工具箱的默认配置。
#
# 解析优先级（从高到低）：
#   1. 环境变量 FACTOR_TOOLKIT_DATA_ROOT（只覆盖 data_root）
#   2. config/paths.local.toml   （本机覆盖，不纳入版本管理）
#   3. 本文件
#
# 换机器时请复制本文件为 paths.local.toml 再改，不要直接改本文件。

# 基础数据目录
data_root = "D:/实习生学习项目/基础数据"

# 正式测试起点：由覆盖率规则确定，与具体因子无关。
# EP 交付版中该值记录在 中间结果/factor_test_start.json，取值为 2020-07-31。
formal_test_start = "2020-07-31"

# 因子文件的搜索目录。用 --factor ep 这样的短名时，会依次在这些目录中找 ep.parquet。
# 也可以直接用 --factor 传完整路径，此时不需要配置这一项。
factor_dirs = [
    "D:/因子计算/factor-ep/因子结果",
    "D:/因子计算/factor-pb/因子结果",
    "D:/因子计算/factor-roe/因子结果",
    "D:/因子计算/factor-size/因子结果",
    "D:/因子计算/factor-turnover/因子结果",
]

# 结果输出目录，留空则使用工具箱下的 output/
# output_dir = "D:/因子计算/因子测试结果"
